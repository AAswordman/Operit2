<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>手表桌宠</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #10131d;
      --panel: #1c2231;
      --line: #343e50;
      --ink: #f4f2e9;
      --muted: #b5bdce;
      --mint: #a5e9cb;
      --peach: #ffbb9e;
      --lilac: #c6bcff;
      font: 15px/1.5 system-ui, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--night);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: radial-gradient(ellipse at 60% 0, #192334, transparent 480px); }
    h1, p, figure, fieldset { margin: 0; }
    h1 { font-size: clamp(27px, 5vw, 37px); line-height: 1.25; letter-spacing: -.035em; }
    button, input { font: inherit; }
    button, input[type=checkbox], .choice { cursor: pointer; }
    button:disabled { opacity: .52; cursor: default; }
    :focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
    .shell { max-width: 1000px; margin: 0 auto; padding: clamp(20px, 5vw, 52px); }
    .header, .device, .toggle, .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header { margin-bottom: clamp(17px, 3vw, 28px); }
    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; font-size: 12px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
    .status[data-connected=true] { color: var(--mint); }
    .studio { display: grid; grid-template-columns: minmax(220px, .92fr) minmax(280px, 1.08fr); gap: 18px; align-items: start; }
    .preview, .panel { border: 1px solid var(--line); border-radius: 24px; min-width: 0; }
    .preview {
      display: grid;
      justify-items: center;
      gap: 15px;
      padding: 25px 16px 18px;
      background: radial-gradient(ellipse at 52% 45%, #313e4d, #1c2231 71%);
    }
    .watch {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: min(93%, 252px);
      aspect-ratio: 1;
      padding: 9px;
      border: 1px solid #627085;
      border-radius: 50%;
      background: linear-gradient(140deg, #4a5566, #242d3c 50%, #3d4b5e);
      box-shadow: 0 15px 32px #0b111e96, inset 0 1px 2px #d8e8ff37;
    }
    .watch::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -8px;
      width: 10px;
      height: 31px;
      border: 1px solid #627085;
      border-radius: 6px;
      background: linear-gradient(#515e70, #273140);
    }
    .face {
      isolation: isolate;
      width: 100%;
      padding: 0;
      aspect-ratio: 1;
      border: 3px solid #0b0f17;
      border-radius: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--night);
    }
    .face { background: radial-gradient(circle, var(--glow, #a5e9cb26), transparent 72%), var(--night); }
    .face img { display: block; width: 88%; height: auto; image-rendering: pixelated; }
    .moods { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .moods button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); background: transparent; }
    .moods button[aria-pressed=true] { color: var(--mint); border-color: var(--mint); }
    figcaption, .help, .toggle small { color: var(--muted); font-size: 13px; }
    .panel { background: var(--panel); padding: clamp(15px, 3vw, 24px); }
    .device strong { display: block; overflow-wrap: anywhere; font-size: 16px; }
    .device small { color: var(--muted); }
    .discovery { display: grid; gap: 12px; margin-top: 16px; }
    .discovery-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .watch-list { display: grid; gap: 8px; }
    .watch-option { width: 100%; padding: 12px; text-align: left; color: var(--ink); background: var(--night); border: 1px solid var(--line); border-radius: 14px; }
    .watch-option strong, .watch-option small { display: block; overflow-wrap: anywhere; }
    .watch-option small { color: var(--muted); margin-top: 4px; }
    .watch-option[aria-pressed=true] { border-color: var(--mint); }
    .scan-issues { white-space: pre-line; color: var(--peach); font-size: 13px; }
    .action { min-height: 44px; padding: 8px 16px; border: 1px solid transparent; border-radius: 999px; font-weight: 650; }
    .primary { color: var(--night); background: var(--mint); }
    .quiet { color: var(--ink); background: transparent; border-color: var(--line); }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    fieldset { min-width: 0; padding: 0; border: 0; }
    .settings { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--line); }
    .theme { padding-bottom: 14px; }
    .theme legend { padding: 0 0 9px; font-weight: 650; }
    .swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .choice { padding: 8px 5px; min-height: 48px; text-align: center; border: 1px solid var(--line); border-radius: 12px; }
    .choice:has(:checked) { border-color: var(--swatch); background: #252f3e; }
    .choice:focus-within { outline: 2px solid var(--mint); outline-offset: 2px; }
    .choice input { position: absolute; opacity: 0; }
    .choice span { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 5px; font-size: 13px; }
    .choice span::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--swatch); }
    .mint { --swatch: var(--mint); }
    .peach { --swatch: var(--peach); }
    .lilac { --swatch: var(--lilac); }
    .toggle { min-height: 55px; border-top: 1px solid var(--line); padding: 8px 0; cursor: pointer; }
    .toggle strong, .toggle small { display: block; }
    .toggle input {
      appearance: none;
      flex: 0 0 39px;
      height: 23px;
      margin: 0 1px 0 0;
      border-radius: 14px;
      border: 1px solid #697488;
      background: #283344;
    }
    .toggle input::before { content: ""; display: block; width: 15px; height: 15px; margin: 3px; border-radius: 50%; background: var(--muted); }
    .toggle input:checked { background: var(--mint); border-color: var(--mint); }
    .toggle input:checked::before { margin-left: 19px; background: var(--night); }
    .footer { justify-content: flex-end; margin-top: 11px; }
    .message { margin-top: 11px; color: var(--mint); font-size: 13px; overflow-wrap: anywhere; }
    .message:empty { margin: 0; }
    .message[data-error=true] { color: var(--peach); }
    .read { margin-top: 11px; }
    @media (max-width: 660px) {
      .studio { grid-template-columns: 1fr; gap: 12px; }
      .watch { width: min(100%, 171px); padding: 6px; }
      .preview { gap: 8px; padding: 13px 12px 9px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <h1>手表桌宠</h1>
      <span id="status" class="status" aria-live="polite">未连接</span>
    </header>
    <div class="studio">
      <figure class="preview">
        <div class="watch">
          <button id="face" class="face" type="button" aria-label="轻点小猫打招呼">
            <img id="pet" src="idle.webp" width="720" height="704" alt="空闲待命的任务状态猫">
          </button>
        </div>
        <figcaption id="caption">空闲待命 · 轻点小猫互动</figcaption>
        <div class="moods" role="group" aria-label="预览动作">
          <button type="button" data-mood="working">工作</button><button type="button" data-mood="thinking">思考</button>
          <button type="button" data-mood="approval">待批准</button><button type="button" data-mood="completed">完成</button>
          <button type="button" data-mood="idle" aria-pressed="true">待机</button><button type="button" data-mood="error">异常</button>
        </div>
        <p class="help">任务变化会自动同步到所选手表。这里可预览六种动作。</p>
      </figure>
      <section class="panel" aria-label="桌宠设置">
        <div class="device" id="device" hidden>
          <div><small>当前手表</small><strong id="watch-name"></strong></div>
          <button class="action quiet" id="switch" type="button">切换</button>
        </div>
        <div class="discovery" id="discovery">
          <div class="discovery-heading"><strong>可用手表</strong><button class="action quiet" id="refresh" type="button" disabled>刷新设备</button></div>
          <p class="help" id="discovery-help" role="status">正在识别已连接的手表…</p>
          <div class="watch-list" id="watch-list" role="group" aria-label="选择手表"></div>
        </div>
        <p id="scan-issues" class="scan-issues" hidden></p>
        <fieldset class="settings" id="settings" hidden disabled>
          <fieldset class="theme">
            <legend>氛围配色</legend>
            <div class="swatches">
              <label class="choice mint"><input type="radio" name="accent" value="mint"><span>薄荷</span></label>
              <label class="choice peach"><input type="radio" name="accent" value="peach"><span>蜜桃</span></label>
              <label class="choice lilac"><input type="radio" name="accent" value="lilac"><span>暮紫</span></label>
            </div>
          </fieldset>
          <label class="toggle"><span><strong>点按触感</strong><small>碰一碰桌宠时振动</small></span><input id="haptics" type="checkbox" role="switch"></label>
          <label class="toggle"><span><strong>保持亮屏</strong><small>停留在桌宠首页时保持屏幕点亮</small></span><input id="awake" type="checkbox" role="switch"></label>
          <div class="footer"><button class="action primary" id="save" type="button">保存到手表</button></div>
        </fieldset>
        <p id="message" class="message" role="status"></p>
      </section>
    </div>
  </main>
  <script>
    const elements = Object.fromEntries(
      ['status', 'face', 'pet', 'caption', 'device', 'watch-name', 'switch', 'discovery', 'refresh',
        'discovery-help', 'watch-list', 'scan-issues', 'settings', 'haptics', 'awake', 'save', 'message']
        .map(id => [id, document.getElementById(id)])
    );
    const swatches = [...document.querySelectorAll('input[name="accent"]')];
    const colors = { mint: '#a5e9cb', peach: '#ffbb9e', lilac: '#c6bcff' };
    const state = { target: null, saved: null, draft: null, watches: [], issues: [], editing: true, ready: false, busy: false, scanning: false, scanned: false };
    const labels = { working: '正在执行', thinking: '正在思考', approval: '等待批准', completed: '任务完成', idle: '空闲待命', error: '需要处理' };
    const moodButtons = [...document.querySelectorAll('[data-mood]')];
    let selectedMood = 'idle', displayedMood = '', reactionTimer = null, completionTimer = null;

    /** Plays the exact packaged animation without drawing a second cat design. */
    function showMood(mood) {
      if (displayedMood !== mood) {
        displayedMood = mood;
        elements.pet.src = `${mood}.webp`;
        elements.pet.alt = `${labels[mood]}的任务状态猫`;
      }
      elements.caption.textContent = `${labels[mood]} · 轻点小猫互动`;
      for (const button of moodButtons) button.setAttribute('aria-pressed', String(button.dataset.mood === selectedMood));
      clearTimeout(completionTimer);
      if (mood === 'completed') completionTimer = setTimeout(() => {
        selectedMood = 'idle'; showMood('idle');
      }, 3000);
    }

    /** Changes only the ambient light around the original blue pixel cat. */
    function renderAccent() {
      const accent = state.draft ? colors[state.draft.accent] : colors.mint;
      elements.face.style.setProperty('--glow', `${accent}26`);
    }

    /** Synchronizes controls with the selected watch and its unsaved settings. */
    function render() {
      elements.status.textContent = state.scanning ? '正在识别' : state.busy ? '处理中' : state.saved ? '已连接' : '未连接';
      elements.status.dataset.connected = String(Boolean(state.saved) && !state.busy);
      elements.device.hidden = !state.target;
      elements['watch-name'].textContent = state.target?.label ?? '';
      elements.switch.textContent = state.editing ? '取消' : '切换';
      elements.switch.disabled = state.busy;
      elements.discovery.hidden = !state.editing;
      elements.refresh.disabled = !state.ready || state.busy;
      elements['discovery-help'].textContent = state.scanning ? '正在识别已连接的手表…'
        : !state.scanned ? '打开后会自动识别设备空间里已连接的手表。'
        : state.watches.length === 0 ? '没有发现可用手表。请在设备空间确认手表已加入且在线，然后刷新设备。'
        : state.watches.length === 1 ? '已识别到 1 块手表，将自动连接。' : `发现 ${state.watches.length} 块手表，请选择要使用的一块。`;
      elements['scan-issues'].hidden = !state.issues.length;
      elements['scan-issues'].textContent = state.issues.map(issue => `${issue.label}：${issue.message}`).join('\n');
      elements['watch-list'].replaceChildren();
      for (const watch of state.watches) {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'watch-option'; button.disabled = state.busy;
        button.setAttribute('aria-pressed', String(watch.target.nodeId === state.target?.nodeId));
        const name = document.createElement('strong'); name.textContent = watch.target.label;
        const detail = document.createElement('small'); detail.textContent = `${watch.model} · ${watch.target.nodeId}`;
        button.append(name, detail);
        button.addEventListener('click', () => void perform(() => connectSelected(watch.target.nodeId)));
        elements['watch-list'].append(button);
      }
      elements.settings.hidden = !state.draft || state.editing;
      elements.settings.disabled = state.busy;
      if (state.draft) {
        for (const swatch of swatches) swatch.checked = swatch.value === state.draft.accent;
        elements.haptics.checked = state.draft.haptics;
        elements.awake.checked = state.draft.keepAwake;
        elements.save.disabled = JSON.stringify(state.draft) === JSON.stringify(state.saved);
      }
      renderAccent();
    }

    /** Calls the package bridge for one operation and reports native errors in place. */
    async function request(payload) {
      const reply = await window.WatchStudio.request(payload);
      if (!reply.ok) throw Error(reply.error);
      return reply.data;
    }

    /** Serializes visible operations so switch and save cannot overlap. */
    async function perform(work) {
      if (state.busy) return;
      state.busy = true;
      elements.message.textContent = '';
      elements.message.dataset.error = 'false';
      render();
      try {
        await work();
      } catch (error) {
        elements.message.textContent = error.message;
        elements.message.dataset.error = 'true';
      } finally {
        state.busy = false;
        render();
      }
    }

    /** Establishes the next draft from a device-confirmed snapshot. */
    function applyConfig(config) {
      state.saved = config;
      state.draft = { ...config };
    }

    /** Connects only an identified device, using its exact identity behind the scenes. */
    async function connectSelected(nodeId) {
      const connected = await request({ action: 'connect', nodeId });
      state.target = connected.target;
      applyConfig(connected.config);
      state.editing = false;
      elements.message.textContent = `已连接 ${connected.target.label}`;
    }

    /** Refreshes eligible devices and applies the backend's verified automatic selection. */
    async function discover(choosing = false) {
      state.scanning = true;
      state.watches = []; state.issues = []; state.scanned = false;
      state.saved = null; state.draft = null;
      render();
      try {
        const result = await request({ action: 'discover' });
        state.watches = result.watches; state.issues = result.issues; state.scanned = true;
        if (result.connected) {
          state.target = result.connected.target;
          applyConfig(result.connected.config);
          state.editing = choosing && result.watches.length > 1;
          elements.message.textContent = `已连接 ${result.connected.target.label}`;
        } else {
          state.target = null; state.saved = null; state.draft = null; state.editing = true;
        }
      } finally { state.scanning = false; }
    }

    /** Discovers connected watches as soon as the host bridge becomes available. */
    async function initialize() {
      if (state.ready) return;
      state.ready = true;
      await perform(discover);
    }

    elements.refresh.addEventListener('click', () => void perform(() => discover(state.editing && Boolean(state.target))));
    elements.switch.addEventListener('click', () => {
      if (state.editing && state.target) { state.editing = false; render(); return; }
      state.editing = true;
      void perform(() => discover(true));
    });
    elements.settings.addEventListener('change', () => {
      state.draft = {
        version: 1,
        accent: swatches.find(swatch => swatch.checked).value,
        haptics: elements.haptics.checked,
        keepAwake: elements.awake.checked,
      };
      elements.message.textContent = '';
      render();
    });
    elements.save.addEventListener('click', () => void perform(async () => {
      applyConfig(await request({ action: 'save', nodeId: state.target.nodeId, config: state.draft }));
      elements.message.textContent = '已保存到手表';
    }));
    for (const button of moodButtons) button.addEventListener('click', () => {
      clearTimeout(reactionTimer);
      selectedMood = button.dataset.mood;
      if (displayedMood === selectedMood) { elements.pet.removeAttribute('src'); displayedMood = ''; }
      showMood(selectedMood);
    });
    elements.face.addEventListener('click', () => {
      clearTimeout(reactionTimer);
      clearTimeout(completionTimer);
      showMood('approval');
      reactionTimer = setTimeout(() => showMood(selectedMood), 1200);
    });
    showMood('idle');
    render();
    window.addEventListener('operitComposeDslInterfacesReady', initialize, { once: true });
    if (window.WatchStudio) void initialize();
  </script>
</body>
</html>
