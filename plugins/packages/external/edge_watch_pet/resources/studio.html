<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>手表桌宠</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #10131d;
      --panel: #1c2231;
      --line: #343e50;
      --ink: #f4f2e9;
      --muted: #b5bdce;
      --mint: #a5e9cb;
      --peach: #ffbb9e;
      --lilac: #c6bcff;
      font: 15px/1.5 system-ui, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--night);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: radial-gradient(ellipse at 60% 0, #192334, transparent 480px); }
    h1, p, figure, fieldset { margin: 0; }
    h1 { font-size: clamp(27px, 5vw, 37px); line-height: 1.25; letter-spacing: -.035em; }
    button, input { font: inherit; }
    button, input[type=checkbox], .choice { cursor: pointer; }
    button:disabled { opacity: .52; cursor: default; }
    :focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
    .shell { max-width: 1000px; margin: 0 auto; padding: clamp(20px, 5vw, 52px); }
    .header, .device, .toggle, .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header { margin-bottom: clamp(17px, 3vw, 28px); }
    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; font-size: 12px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
    .status[data-connected=true] { color: var(--mint); }
    .studio { display: grid; grid-template-columns: minmax(220px, .92fr) minmax(280px, 1.08fr); gap: 18px; align-items: start; }
    .preview, .panel { border: 1px solid var(--line); border-radius: 24px; min-width: 0; }
    .preview {
      display: grid;
      justify-items: center;
      gap: 15px;
      padding: 25px 16px 18px;
      background: radial-gradient(ellipse at 52% 45%, #313e4d, #1c2231 71%);
    }
    .watch {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: min(93%, 252px);
      aspect-ratio: 1;
      padding: 9px;
      border: 1px solid #627085;
      border-radius: 50%;
      background: linear-gradient(140deg, #4a5566, #242d3c 50%, #3d4b5e);
      box-shadow: 0 15px 32px #0b111e96, inset 0 1px 2px #d8e8ff37;
    }
    .watch::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -8px;
      width: 10px;
      height: 31px;
      border: 1px solid #627085;
      border-radius: 6px;
      background: linear-gradient(#515e70, #273140);
    }
    .face {
      isolation: isolate;
      width: 100%;
      padding: 0;
      aspect-ratio: 1;
      border: 3px solid #0b0f17;
      border-radius: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--night);
    }
    .face canvas { display: block; width: 100%; height: auto; }
    figcaption, .help, .toggle small { color: var(--muted); font-size: 13px; }
    .panel { background: var(--panel); padding: clamp(15px, 3vw, 24px); }
    .device strong { display: block; overflow-wrap: anywhere; font-size: 16px; }
    .device small { color: var(--muted); }
    .device + form:not([hidden]) { margin-top: 16px; }
    .connect label { display: block; margin-bottom: 7px; font-weight: 600; }
    .connect .help { margin-top: 9px; }
    .input-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .input-row input { flex: 1 1 150px; min-width: 0; }
    input[type=text] {
      min-height: 44px;
      padding: 9px 12px;
      color: inherit;
      background: var(--night);
      border: 1px solid var(--line);
      border-radius: 13px;
    }
    .action { min-height: 44px; padding: 8px 16px; border: 1px solid transparent; border-radius: 999px; font-weight: 650; }
    .primary { color: var(--night); background: var(--mint); }
    .quiet { color: var(--ink); background: transparent; border-color: var(--line); }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    fieldset { min-width: 0; padding: 0; border: 0; }
    .settings { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--line); }
    .theme { padding-bottom: 14px; }
    .theme legend { padding: 0 0 9px; font-weight: 650; }
    .swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .choice { padding: 8px 5px; min-height: 48px; text-align: center; border: 1px solid var(--line); border-radius: 12px; }
    .choice:has(:checked) { border-color: var(--swatch); background: #252f3e; }
    .choice:focus-within { outline: 2px solid var(--mint); outline-offset: 2px; }
    .choice input { position: absolute; opacity: 0; }
    .choice span { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 5px; font-size: 13px; }
    .choice span::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--swatch); }
    .mint { --swatch: var(--mint); }
    .peach { --swatch: var(--peach); }
    .lilac { --swatch: var(--lilac); }
    .toggle { min-height: 55px; border-top: 1px solid var(--line); padding: 8px 0; cursor: pointer; }
    .toggle strong, .toggle small { display: block; }
    .toggle input {
      appearance: none;
      flex: 0 0 39px;
      height: 23px;
      margin: 0 1px 0 0;
      border-radius: 14px;
      border: 1px solid #697488;
      background: #283344;
    }
    .toggle input::before { content: ""; display: block; width: 15px; height: 15px; margin: 3px; border-radius: 50%; background: var(--muted); }
    .toggle input:checked { background: var(--mint); border-color: var(--mint); }
    .toggle input:checked::before { margin-left: 19px; background: var(--night); }
    .footer { justify-content: flex-end; margin-top: 11px; }
    .message { margin-top: 11px; color: var(--mint); font-size: 13px; overflow-wrap: anywhere; }
    .message:empty { margin: 0; }
    .message[data-error=true] { color: var(--peach); }
    .read { margin-top: 11px; }
    @media (max-width: 660px) {
      .studio { grid-template-columns: 1fr; gap: 12px; }
      .watch { width: min(100%, 171px); padding: 6px; }
      .preview { gap: 8px; padding: 13px 12px 9px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <h1>手表桌宠</h1>
      <span id="status" class="status" aria-live="polite">未连接</span>
    </header>
    <div class="studio">
      <figure class="preview">
        <div class="watch">
          <button id="face" class="face" type="button" aria-label="轻点小猫打招呼">
            <canvas id="pet" width="480" height="480" aria-hidden="true"></canvas>
          </button>
        </div>
        <figcaption>手表预览</figcaption>
      </figure>
      <section class="panel" aria-label="桌宠设置">
        <div class="device" id="device" hidden>
          <div><small>当前手表</small><strong id="watch-name"></strong></div>
          <button class="action quiet" id="switch" type="button">切换</button>
        </div>
        <form class="connect" id="connect">
          <label for="reference">手表名称或节点 ID</label>
          <div class="input-row">
            <input id="reference" type="text" maxlength="128" required autocomplete="off" spellcheck="false" aria-describedby="connect-help">
            <button id="connect-button" class="action primary" type="submit" disabled>连接</button>
          </div>
          <p class="help" id="connect-help">先在 Operit 的「设备空间」完成配对和加入。输入不含空格的设备名称或节点 ID。</p>
        </form>
        <button class="action quiet read" id="read" type="button" hidden>重新读取</button>
        <fieldset class="settings" id="settings" hidden disabled>
          <fieldset class="theme">
            <legend>氛围配色</legend>
            <div class="swatches">
              <label class="choice mint"><input type="radio" name="accent" value="mint"><span>薄荷</span></label>
              <label class="choice peach"><input type="radio" name="accent" value="peach"><span>蜜桃</span></label>
              <label class="choice lilac"><input type="radio" name="accent" value="lilac"><span>暮紫</span></label>
            </div>
          </fieldset>
          <label class="toggle"><span><strong>点按触感</strong><small>碰一碰桌宠时振动</small></span><input id="haptics" type="checkbox" role="switch"></label>
          <label class="toggle"><span><strong>保持亮屏</strong><small>停留在桌宠首页时保持屏幕点亮</small></span><input id="awake" type="checkbox" role="switch"></label>
          <div class="footer"><button class="action primary" id="save" type="button">保存到手表</button></div>
        </fieldset>
        <p id="message" class="message" role="status"></p>
      </section>
    </div>
  </main>
  <script>
    const elements = Object.fromEntries(
      ['status', 'face', 'pet', 'device', 'watch-name', 'switch', 'connect', 'reference',
        'connect-button', 'read', 'settings', 'haptics', 'awake', 'save', 'message']
        .map(id => [id, document.getElementById(id)])
    );
    const swatches = [...document.querySelectorAll('input[name="accent"]')];
    const colors = { mint: '#a5e9cb', peach: '#ffbb9e', lilac: '#c6bcff' };
    const brush = elements.pet.getContext('2d');
    const state = { target: null, saved: null, draft: null, editing: true, ready: false, busy: false };
    let animation = 0;
    const cat = {
      body: new Path2D('M-34 14 C-47 31 -49 52 -36 61 C-25 68 14 67 25 59 C38 49 33 26 18 12 Z'),
      tail: new Path2D('M19 52 C49 69 83 53 75 29 C71 16 56 18 57 29'),
      head: new Path2D(
        'M-56 -23 C-59 -35 -62 -50 -59 -60 Q-58 -65 -53 -62 C-43 -58 -33 -49 -27 -44 ' +
        'C-17 -48 -2 -49 11 -45 C20 -53 29 -59 39 -62 Q44 -64 45 -59 C47 -50 44 -33 41 -24 ' +
        'C55 -15 55 3 49 14 C40 31 18 37 -8 37 C-35 37 -55 29 -62 12 C-67 0 -66 -14 -56 -23 Z'
      ),
      ears: new Path2D(
        'M-53 -55 Q-43 -53 -35 -43 Q-46 -40 -51 -34 Q-54 -46 -53 -55 Z ' +
        'M38 -54 Q40 -46 35 -34 Q30 -39 21 -43 Q30 -51 38 -54 Z'
      ),
      muzzle: new Path2D('M-43 12 C-38 1 -22 3 -8 10 C4 3 22 1 28 11 C36 22 22 33 -8 34 C-34 34 -50 24 -43 12 Z'),
      nose: new Path2D('M-13 11 Q-8 9 -3 11 Q-3 14 -8 17 Q-13 14 -13 11 Z'),
      whiskers: new Path2D('M-39 12 L-60 8 M-39 18 L-58 22 M23 12 L44 8 M23 18 L42 22'),
      smile: new Path2D('M-8 17 L-8 21 C-11 25 -17 24 -19 20 M-8 21 C-5 25 1 24 3 20'),
      spark: new Path2D('M0 -1 Q.18 -.18 1 0 Q.18 .18 0 1 Q-.18 .18 -1 0 Q-.18 -.18 0 -1 Z'),
    };

    /** Paints the blue cat with the same pose and greeting as the watch renderer. */
    function drawPet(accent, hop = 0) {
      brush.clearRect(0, 0, 480, 480);
      brush.save();
      brush.translate(240, 221);
      brush.scale(1.98, 1.98);
      const halo = brush.createRadialGradient(0, -13, 0, 0, -13, 124);
      halo.addColorStop(0, `${accent}3d`);
      halo.addColorStop(1, `${accent}00`);
      oval(0, -13, 124, 124, halo);
      oval(8, 65, 60 - hop * 6, 6, '#090c1399');
      brush.save();
      brush.translate(0, -12 * hop);
      drawBody(hop);
      drawFace(hop > .25);
      brush.restore();
      if (hop > .01) {
        drawSpark(-73 - hop * 5, -21 - hop * 18, 5 * hop, '#ffbb9e');
        drawSpark(67 + hop * 5, -20 - hop * 15, 7 * hop, accent);
      }
      brush.restore();
    }

    /** Draws the curling tail behind the sitting pose. */
    function drawBody(hop) {
      brush.save();
      brush.translate(19, 52);
      brush.rotate(-Math.PI * hop / 15);
      brush.translate(-19, -52);
      brush.strokeStyle = '#508fc5';
      brush.lineCap = 'round';
      brush.lineWidth = 15;
      brush.stroke(cat.tail);
      brush.restore();
      brush.fillStyle = '#477db0';
      brush.fill(cat.body);
      oval(-9.5, 43, 16.5, 18, '#9ec8e5');
      oval(-23.5, 60, 13.5, 6, '#c5e3f4');
      oval(8.5, 60, 13.5, 6, '#c5e3f4');
    }

    /** Draws the cat's coat and facial details at small sizes. */
    function drawFace(greeting) {
      const shade = brush.createLinearGradient(-31, -54, 19, 30);
      shade.addColorStop(0, '#85c8ed');
      shade.addColorStop(1, '#4d91cb');
      brush.fillStyle = shade;
      brush.fill(cat.head);
      brush.fillStyle = '#df9eac';
      brush.fill(cat.ears);
      brush.fillStyle = '#d9edf7';
      brush.fill(cat.muzzle);
      brush.strokeStyle = '#182d45';
      brush.lineWidth = 3.4;
      brush.lineCap = 'round';
      for (const center of [-30, 14]) {
        if (greeting) {
          brush.beginPath();
          brush.ellipse(center, -4, 7, 6, 0, 13 * Math.PI / 12, 23 * Math.PI / 12);
          brush.stroke();
        } else {
          oval(center, -4.5, 6, 8.5, '#182d45');
          oval(center - 2, -8, 1.8, 1.8, '#f4fbfd');
        }
      }
      brush.strokeStyle = '#365570';
      brush.lineWidth = 2.1;
      brush.stroke(cat.smile);
      brush.strokeStyle = '#325671';
      brush.lineWidth = 1.8;
      brush.stroke(cat.whiskers);
      brush.fillStyle = '#b7607f';
      brush.fill(cat.nose);
    }

    /** Draws one small spark during the greeting. */
    function drawSpark(centerX, centerY, radius, color) {
      brush.save();
      brush.translate(centerX, centerY);
      brush.scale(radius, radius);
      brush.fillStyle = color;
      brush.fill(cat.spark);
      brush.restore();
    }

    /** Fills a single pet detail in logical watch coordinates. */
    function oval(xCenter, yCenter, xRadius, yRadius, color) {
      brush.fillStyle = color;
      brush.beginPath();
      brush.ellipse(xCenter, yCenter, xRadius, yRadius, 0, 0, 2 * Math.PI);
      brush.fill();
    }

    /** Uses mint for the unconfigured preview and the draft color while editing. */
    function currentColor() { return state.draft ? colors[state.draft.accent] : colors.mint; }

    /** Synchronizes controls with the selected watch and its unsaved settings. */
    function render() {
      elements.status.textContent = state.busy ? '处理中' : state.saved ? '已连接' : '未连接';
      elements.status.dataset.connected = String(Boolean(state.saved) && !state.busy);
      elements.device.hidden = !state.target;
      elements['watch-name'].textContent = state.target?.label ?? '';
      elements.switch.textContent = state.editing ? '取消' : '切换';
      elements.switch.disabled = state.busy;
      elements.connect.hidden = !state.editing;
      elements['connect-button'].disabled = !state.ready || state.busy;
      elements.reference.disabled = state.busy;
      elements.read.hidden = !state.target || Boolean(state.saved) || state.editing;
      elements.read.disabled = state.busy;
      elements.settings.hidden = !state.draft || state.editing;
      elements.settings.disabled = state.busy;
      if (state.draft) {
        for (const swatch of swatches) swatch.checked = swatch.value === state.draft.accent;
        elements.haptics.checked = state.draft.haptics;
        elements.awake.checked = state.draft.keepAwake;
        elements.save.disabled = JSON.stringify(state.draft) === JSON.stringify(state.saved);
      }
      drawPet(currentColor());
    }

    /** Calls the package bridge for one operation and reports native errors in place. */
    async function request(payload) {
      const reply = await window.WatchStudio.request(payload);
      if (!reply.ok) throw Error(reply.error);
      return reply.data;
    }

    /** Serializes visible operations so switch and save cannot overlap. */
    async function perform(work) {
      if (state.busy) return;
      state.busy = true;
      elements.message.textContent = '';
      elements.message.dataset.error = 'false';
      render();
      try {
        await work();
      } catch (error) {
        elements.message.textContent = error.message;
        elements.message.dataset.error = 'true';
      } finally {
        state.busy = false;
        render();
      }
    }

    /** Establishes the next draft from a device-confirmed snapshot. */
    function applyConfig(config) {
      state.saved = config;
      state.draft = { ...config };
    }

    /** Reads settings for the currently selected device. */
    async function readSelected() {
      applyConfig(await request({ action: 'read', nodeId: state.target.nodeId }));
    }

    /** Restores the selection when the Compose host has installed the bridge. */
    async function initialize() {
      if (state.ready) return;
      state.ready = true;
      await perform(async () => {
        state.target = await request({ action: 'selected' });
        state.editing = !state.target;
        if (state.target) await readSelected();
      });
    }

    elements.connect.addEventListener('submit', event => {
      event.preventDefault();
      const reference = elements.reference.value;
      void perform(async () => {
        const connected = await request({ action: 'connect', reference });
        state.target = connected.target;
        state.editing = false;
        elements.reference.value = '';
        applyConfig(connected.config);
      });
    });
    elements.switch.addEventListener('click', () => {
      state.editing = !state.editing;
      elements.message.textContent = '';
      render();
      if (state.editing) elements.reference.focus();
    });
    elements.read.addEventListener('click', () => void perform(readSelected));
    elements.settings.addEventListener('change', () => {
      state.draft = {
        version: 1,
        accent: swatches.find(swatch => swatch.checked).value,
        haptics: elements.haptics.checked,
        keepAwake: elements.awake.checked,
      };
      elements.message.textContent = '';
      render();
    });
    elements.save.addEventListener('click', () => void perform(async () => {
      applyConfig(await request({ action: 'save', nodeId: state.target.nodeId, config: state.draft }));
      elements.message.textContent = '已保存到手表';
    }));
    elements.face.addEventListener('click', () => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      cancelAnimationFrame(animation);
      const start = performance.now();
      /** Animates a brief local greeting without writing watch settings. */
      function greet(now) {
        const progress = Math.min(1, (now - start) / 620);
        drawPet(currentColor(), Math.sin(progress * Math.PI));
        if (progress < 1) animation = requestAnimationFrame(greet);
      }
      animation = requestAnimationFrame(greet);
    });
    render();
    window.addEventListener('operitComposeDslInterfacesReady', initialize, { once: true });
    if (window.WatchStudio) void initialize();
  </script>
</body>
</html>
