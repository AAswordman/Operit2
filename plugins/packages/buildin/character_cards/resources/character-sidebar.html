  // src/chat-extensions.ts
  async function readChatExtensionBinding(chatId) {
    requireId(chatId, "chat id");
    const extension = await Tools.Chat.readExtension({ kind: "chat", chatId });
    if (extension === null) throw new Error("Chat has no character selection in this plugin's namespace: " + chatId);
    const marker = decodeChatMarker(extension);
    return { chatId, selection: marker.selection };
  }
  async function readMessageExtensionMarker(chatId, messageTimestamp, variantIndex) {
    requireId(chatId, "chat id");
    assertInteger(messageTimestamp, "message timestamp", 0);
    assertInteger(variantIndex, "message variant index", 0);
    if (variantIndex > 2147483647) throw new Error("Message variant index exceeds the host's i32 range");
    const extension = await Tools.Chat.readExtension({ kind: "message", chatId, messageTimestamp, variantIndex });
    if (extension === null) throw new Error("Message revision has no saved character identity in this plugin's namespace: " + chatId + "/" + messageTimestamp + "/" + variantIndex);
    return decodeMessageMarker(extension);
  }
  async function listChatExtensionBindings() {
    const result = await Tools.Chat.listAll();
    assertInteger(result.totalCount, "all chat count", 0);
    if (!Array.isArray(result.chats) || result.chats.length !== result.totalCount) throw new Error("Chat.listAll did not return its complete declared records");
    const bindings = [], ids = /* @__PURE__ */ new Set();
    for (const chat of result.chats) {
      const chatId = requireId(chat.id, "host chat id");
      if (ids.has(chatId)) throw new Error("Duplicate host chat identity: " + chatId);
      ids.add(chatId);
      const extension = await Tools.Chat.readExtension({ kind: "chat", chatId });
      if (extension === null) continue;
      const marker = decodeChatMarker(extension);
      bindings.push({ chatId, selection: marker.selection });
    }
    return bindings;
  }
  async function writeChatExtensionBinding(binding) {
    requireId(binding.chatId, "chat id");
    const target = { kind: "chat", chatId: binding.chatId };
    const existing = await Tools.Chat.readExtension(target), value = encodeChatMarker(binding.selection, existing === null ? null : markerObject(existing, "existing chat extension"));
    const stored = await Tools.Chat.writeExtension(target, value), marker = decodeChatMarker(stored);
    if (marker.selection !== binding.selection) throw new Error("Stored chat extension selection differs from the submitted value");
    return { chatId: binding.chatId, selection: marker.selection };
  }
  async function deleteChatExtensionBinding(chatId) {
    requireId(chatId, "chat id");
    const deleted = await Tools.Chat.deleteExtension({ kind: "chat", chatId });

  function assertChat(value) {
    assertObject(value, "chat");
    requireId(value.id, "chat id");
    assertString(value.title, "chat title");
    for (const key of ["messageCount", "inputTokens", "outputTokens"]) assertInteger(value[key], key, 0);
    for (const key of ["createdAt", "updatedAt"]) assertString(value[key], key);
    assertBoolean(value.isCurrent, "current chat");

  async function requireChat(chatId) {
    requireId(chatId, "chat id");
    const result = await Tools.Chat.findChat({ query: chatId, match: "exact", index: 0 });
    assertInteger(result.matchedCount, "matched chat count", 1);
    assertChat(result.chat);
    if (result.matchedCount !== 1 || result.chat.id !== chatId) throw new Error("Chat lookup does not identify exactly one host record: " + chatId);

  async function chatParticipants(chatId, repository) {
    const binding = await repository.readChatBinding(chatId), cards = await repository.listCharacters(), groups = await repository.listGroups();
    const selection = requireChatSelection(binding.selection, cards, groups);

    const members = [...group.members].sort(

    const bridge = host(), element = document.getElementById("app");
    if (element === null) throw new Error("The sidebar document has no app root");

      if (owner2 !== JSON.stringify(controller.state.current)) throw new Error("Sidebar context changed during catalog read");
      controller.setData(data);
    }
    function scope(id2) {

        (candidate) => candidate.id === id2

      return value;
    }
    function groupScope(id2) {

        (candidate) => candidate.groups.some(
          /** Identifies membership in the projected scope. */
          (group) => group.id === id2

      if (matches.length !== 1) throw new Error("Conversation group has no unique scope: " + id2);
      return matches[0];
    }
    async function readGroup(id2, owner2) {
      const records2 = await bridge.domain({ operation: "conversation-group.list", payload: { ownerSelection: owner2.ownerSelection } });
      const record2 = records2.find(
        /** Requires the explicitly selected persisted id. */
        (candidate) => candidate.id === id2
      );
      if (record2 === void 0) throw new Error("Conversation group no longer exists: " + id2);
      return record2;
    }
    async function submitDialog() {

      if (dialog === null) throw new Error("No sidebar dialog is open");
      switch (dialog.type) {
        case "create-group":
          await bridge.domain({ operation: "conversation-group.create", payload: { ownerSelection: scope(dialog.scopeId).ownerSelection, name: dialog.name, pinned: false } });
          break;
        case "rename-group":
          await bridge.domain({ operation: "conversation-group.update", payload: { id: dialog.groupId, changes: { name: dialog.name } } });
          break;
        case "move-chat": {
          const data = controller.state.data;
          if (data === null || data.view !== "groups") throw new Error("Conversation-group catalog is not loaded");
          const owners = data.scopes.filter(
            /** Finds the chat only in its actual projected native membership. */
            (candidate) => candidate.ungrouped.some(

              (chat) => chat.id === dialog.chatId

              /** Matches the exact grouped chat. */

                (chat) => chat.id === dialog.chatId

            /** Reads actual remaining memberships after native deletion callbacks. */
            readGroup: (id2) => readGroup(id2, owner2),
            /** Removes only the confirmed empty plugin record. */
            deleteMetadata: (id2) => bridge.domain({ operation: "conversation-group.delete", payload: { id: id2 } })

        }

      controller.state.dialog = null;
      await refresh();
    }
    async function dispatch2(intent) {

      if (state.busy) throw new Error("A sidebar operation is already running");
      state.error = "";
      state.busy = true;

        switch (intent.type) {

            await refresh();
            break;
          case "activate-chat":
            await bridge.activateChat(intent.chatId);

          case "toggle-section":

            else state.collapsedSections.add(intent.sectionId);
            break;
          case "toggle-group":

            break;
          case "rename-group": {

            break;

              /** Retains the actual complete persisted scope order. */
              (record2) => record2.id

            if (index < 0 || target < 0 || target >= ids.length) throw new Error("Conversation group cannot move beyond its scope order");
            [ids[index], ids[target]] = [ids[target], ids[index]];
            await bridge.domain({ operation: "conversation-group.reorder", payload: { ownerSelection: owner2.ownerSelection, ids } });
            await refresh();
            break;
          }
          case "move-chat": {
            const data = state.data;
            if (data === null || data.view !== "groups") throw new Error("Conversation-group catalog is not loaded");
            const choices = [{ id: "", title: "\u672A\u5206\u7EC4" }];
            for (const owner2 of data.scopes) for (const group of owner2.groups) choices.push({ id: group.id, title: owner2.title + " / " + group.name });
            state.dialog = { type: "move-chat", chatId: intent.chatId, groupId: null, choices };
            break;
          }
          case "create-chat": {
            const data = state.data;
            if (data === null) throw new Error("Sidebar catalog is not loaded");

            if (data.view === "groups") selection = scope(intent.sectionId).ownerSelection;

                /** Requires the exact selected character category. */

              selection = section.selection;

    window.updateCharacterSidebar = async function updateCharacterSidebar(current) {

  }

  }
  void start();
})();
