[package]
name = "operit-host-macos-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
daemon = ["dep:tokio", "operit-host-native-common/daemon"]

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"], optional = true }
operit-host-apple-native = { path = "../apple" }
operit-host-api = { path = "../../core/crates/foundation/host-api" }
operit-host-native-common = { path = "../common/operit-host-native-common", default-features = false, features = ["tcp", "serial", "storage"] }
operit-host-native-plugin-sdk-ipc = { path = "../common/operit-host-native-plugin-sdk-ipc" }
