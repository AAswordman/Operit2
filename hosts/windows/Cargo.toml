[package]
name = "operit-host-windows-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
daemon = ["operit-host-native-common/daemon", "tokio/macros", "tokio/rt", "tokio/signal", "tokio/sync", "tokio/time", "windows-sys/Win32_Security_Authorization"]

[dependencies]
operit-host-local-inference = { path = "../common/operit-host-local-inference" }
tokio = { version = "1", features = ["io-util", "net"] }
base64 = "0.22"
globset = "0.4.18"
ignore = "0.4.26"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
operit-host-api = { path = "../../core/crates/foundation/host-api" }
operit-host-native-common = { path = "../common/operit-host-native-common", default-features = false, features = ["tcp", "serial", "fs", "http", "scheduler", "storage", "app-install"] }
operit-host-native-plugin-sdk-ipc = { path = "../common/operit-host-native-plugin-sdk-ipc" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "blocking", "multipart", "rustls-tls"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tungstenite = "0.24"
url = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Devices_Bluetooth", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Media_Multimedia", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Devices_Geolocation", "Foundation", "Foundation_Collections", "Networking_Connectivity", "Storage_Streams", "UI_Notifications", "Win32_System_WinRT"] }
windows-future = "0.3.2"
windows-collections = "0.3.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
operit-util = { path = "../../core/crates/foundation/util" }
