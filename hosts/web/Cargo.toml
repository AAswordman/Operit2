[package]
name = "operit-host-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
operit-store = { path = "../../core/crates/persistence/store", default-features = false }
operit-data-rescue = { path = "../../core/crates/persistence/rescue" }
anyhow = "1"
async-trait = "0.1"
js-sys = "0.3"
operit-host-api = { path = "../../core/crates/foundation/host-api" }
operit-proxy-local = { path = "../../core/crates/proxy/local" }
operit-runtime = { path = "../../core/crates/runtime/application", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "Event", "EventTarget", "MessageEvent", "Navigator", "WebSocket", "Window"] }
