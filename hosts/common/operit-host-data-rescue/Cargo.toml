[package]
name = "operit-host-data-rescue"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
operit-data-rescue = { path = "../../../core/crates/persistence/rescue" }
operit-store = { path = "../../../core/crates/persistence/store", default-features = false }
operit-host-api = { path = "../../../core/crates/foundation/host-api" }
operit-host-native-storage = { path = "../operit-host-native-storage" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
