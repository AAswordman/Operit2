[package]
name = "operit-host-native-http"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
http-body-util = "0.1"
tower = "0.5"
futures-util = "0.3"
operit-host-native-scheduler = { path = "../operit-host-native-scheduler", default-features = false }
operit-host-api = { path = "../../../core/crates/foundation/host-api" }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "stream"] }
# Match reqwest's bundled trust roots; iOS has no Unix CA certificate store.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
