[package]
name = "operit-host-native-scheduler"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["javascript"]
javascript = ["dep:v8"]
# Desktop simulator mode that uses the ESP32 host worker stack budget.
esp32-compat = []

[dependencies]
bytes = "1"
serde_json = "1"
operit-host-api = { path = "../../../core/crates/foundation/host-api" }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
v8 = { version = "152.2.0", optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util"] }
