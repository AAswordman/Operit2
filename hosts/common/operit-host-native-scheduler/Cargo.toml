[package]
name = "operit-host-native-scheduler"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
operit-host-api = { path = "../../../core/crates/foundation/host-api" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_env = "ohos")))'.dependencies]
rquickjs = "0.12.0"

[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
rquickjs = { version = "0.12.0", features = ["bindgen"] }
