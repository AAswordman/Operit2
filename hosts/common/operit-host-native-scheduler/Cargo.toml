[package]
name = "operit-host-native-scheduler"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["javascript"]
# Desktop hosts run the V8 engine. Android/iOS/OpenHarmony compile QuickJS from
# source through rquickjs because the v8 crate publishes no prebuilt bindings
# for any Android target (see javascript_engine_quickjs.rs).
javascript = ["dep:v8", "dep:rquickjs"]
# Desktop simulator mode that uses the ESP32 host worker stack budget.
esp32-compat = []

[dependencies]
bytes = "1"
serde_json = "1"
operit-host-api = { path = "../../../core/crates/foundation/host-api" }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_env = "ohos")))'.dependencies]
v8 = { version = "152.2.0", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
rquickjs = { version = "=0.12.2", features = ["bindgen"], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util"] }
