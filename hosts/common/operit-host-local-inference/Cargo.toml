[package]
name = "operit-host-local-inference"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["native-llm"]
native-llm = ["dep:cmake"]

[build-dependencies]
cmake = { version = "0.1", optional = true }

[dependencies]
operit-host-contract = { path = "../../../core/crates/foundation/host-contract" }
operit-local-models = { path = "../../../core/crates/provider/local-model", default-features = false }
operit-util = { path = "../../../core/crates/foundation/util" }
serde_json = "1"