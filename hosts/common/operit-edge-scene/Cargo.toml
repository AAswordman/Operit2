[package]
name = "operit-edge-scene"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Optional bounded scene renderer for Edge device applications."

[dependencies]
operit-node-edge = { path = "../../../core/crates/node/edge" }
operit-edge-contract = { path = "../../../core/crates/node/edge-contract" }
operit-link = { path = "../../../core/crates/foundation/link" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js", "less-safe-getrandom-espidf"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
