[package]
name = "operit-esp32-simulator"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
operit-host-native-storage = { path = "../../../hosts/common/operit-host-native-storage" }
linked_list_allocator = "0.10.6"
uuid = { version = "1", features = ["v4"] }
operit-node-runtime = { path = "../../../core/crates/node/runtime", default-features = false }
operit-host-native-common = { path = "../../../hosts/common/operit-host-native-common", features = ["tcp", "storage", "http"] }
operit-host-native-scheduler = { path = "../../../hosts/common/operit-host-native-scheduler", default-features = false, features = ["esp32-compat"] }
operit-peer-link = { path = "../../../core/crates/node/peer-link" }
operit-edge-contract = { path = "../../../core/crates/node/edge-contract" }
operit-store = { path = "../../../core/crates/persistence/store", default-features = false, features = ["node-state"] }
async-trait = "0.1"
log = "0.4"
base64 = "0.22"
operit-host-api = { path = "../../../core/crates/foundation/host-api" }
operit-util = { path = "../../../core/crates/foundation/util" }
operit-link = { path = "../../../core/crates/foundation/link" }
operit-node-edge = { path = "../../../core/crates/node/edge" }
operit-edge-scene = { path = "../../../hosts/common/operit-edge-scene" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "io-util", "io-std"] }

# The protocol fixtures share firmware async code and its 32 KiB worker stack.
# Optimize the fixture's nested futures without increasing the device budget.
[profile.test.package.operit-esp32-simulator]
opt-level = 1

# The simulator uses sixteen desktop discovery events rather than 1024-entry OS queues.
# Run ../prepare-simulator.py before invoking Cargo directly.
[patch.crates-io]
polling = { path = ".embuild/polling-2.8.0" }
