[workspace]
members = [
    "crates/foundation/host-api",
    "crates/foundation/model",
    "crates/foundation/util",
    "crates/foundation/link",
    "crates/persistence/store",
    "crates/provider/services",
    "crates/provider/local-model",
    "crates/tool/services",
    "crates/plugin/sdk",
    "crates/plugin/codegen",
    "crates/plugin/javascript-bridge",
    "crates/runtime/application",
    "crates/node/route-macros",
    "crates/node/runtime",
    "crates/access/runtime",
    "crates/rslink/runtime",
    "crates/rslink/codegen",
    "crates/proxy/scan",
    "crates/proxy/rust-codegen",
    "crates/proxy/dart-codegen",
    "crates/proxy/bridge",
    "crates/proxy/local",
    "crates/application/core",
    "crates/command/core"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
json5 = "0.4"
rquickjs = "0.12.0"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
tokio = { version = "1", default-features = false }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
bzip2 = "0.4"
bzip2-rs = "0.1.2"
tar = "0.4"
lmdb = { package = "lmdb-rkv", version = "0.14" }
wasmi = { version = "2.0.0-beta.7", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }
