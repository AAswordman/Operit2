[package]
name = "operit-util"
version = "2.0.0-preview.17"
edition.workspace = true
license.workspace = true
publish = true
description = "Shared utility services and stream primitives for Operit."
readme = "README.md"
repository = "https://github.com/AAswordman/Operit2"
documentation = "https://docs.rs/operit-util"

[features]
default = ["full"]
full = ["dep:flate2", "dep:regex", "dep:zip"]

[dependencies]
operit-host-api = { version = "0.1.0", path = "../host-api" }
chrono.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
regex = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
zip = { workspace = true, optional = true }
