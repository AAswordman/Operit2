[package]
name = "operit-vfs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = true
description = "Shared virtual filesystem, file references and mount resolution for Operit."
repository = "https://github.com/AAswordman/Operit2"

[dependencies]
operit-host-contract = { version = "0.1.0", path = "../host-contract" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
operit-host-native-filesystem = { path = "../../../../hosts/common/operit-host-native-filesystem" }
operit-host-native-storage = { path = "../../../../hosts/common/operit-host-native-storage" }
operit-host-native-terminal = { path = "../../../../hosts/common/operit-host-native-terminal" }
