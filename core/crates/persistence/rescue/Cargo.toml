[package]
name = "operit-data-rescue"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
operit-host-api = { path = "../../foundation/host-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "js"] }
