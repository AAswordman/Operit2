[package]
name = "operit-plugin-sdk-ipc"
version = "2.0.0-preview.8"
edition.workspace = true
license.workspace = true
publish = false
description = "Plugin SDK Link session, types, and Operit IPC dispatch over Host IPC bytes."

[dependencies]
async-trait.workspace = true
operit-host-api = { path = "../../foundation/host-api" }
operit-link = { path = "../../foundation/link" }
serde.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[dev-dependencies]
operit-host-native-plugin-sdk-ipc = { path = "../../../../hosts/common/operit-host-native-plugin-sdk-ipc" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
