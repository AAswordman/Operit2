[package]
name = "operit-js-bridge"
version = "2.0.0-preview.6"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.8"
base64.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10"
operit-host-api = { path = "../../foundation/host-api" }
operit-plugin-sdk = { path = "../sdk" }
operit-store = { path = "../../persistence/store" }
operit-util = { path = "../../foundation/util" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
operit-host-native-scheduler = { path = "../../../../hosts/common/operit-host-native-scheduler" }
zip.workspace = true
