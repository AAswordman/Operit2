[package]
name = "operit-plugin-sdk-codegen"
version = "2.0.0-preview.8"
edition.workspace = true
license.workspace = true
publish = true
description = "Rust AST based TypeScript declaration generator for operit-plugin-sdk."
repository = "https://github.com/AAswordman/Operit2"

[dependencies]
operit-rslink-codegen = { path = "../../rslink/codegen" }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"

[dev-dependencies]
operit-proxy-scan = { path = "../../proxy/scan" }
