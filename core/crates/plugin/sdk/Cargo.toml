[package]
name = "operit-plugin-sdk"
version = "2.0.0-preview.17"
edition.workspace = true
license.workspace = true
publish = true
description = "Public plugin package models, ToolPkg parsers, and JavaScript execution contracts for Operit."
readme = "README.md"
repository = "https://github.com/AAswordman/Operit2"
documentation = "https://docs.rs/operit-plugin-sdk"

[dependencies]
operit-plugin-sdk-macros = { version = "=2.0.0-preview.17", path = "../sdk-macros" }
operit-plugin-theme = { path = "../theme" }
chacha20poly1305 = "0.10"
chrono.workspace = true
json5.workspace = true
operit-host-api = { path = "../../foundation/host-api" }
regex.workspace = true
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
zip.workspace = true
zeroize = "1"
sha2.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmi.workspace = true

[build-dependencies]
serde_json.workspace = true
operit-plugin-sdk-codegen = { version = "=2.0.0-preview.17", path = "../codegen" }

[dev-dependencies]
image.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
operit-host-native-scheduler = { path = "../../../../hosts/common/operit-host-native-scheduler" }
