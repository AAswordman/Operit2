[package]
name = "operit-node-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
operit-host-api = { path = "../../foundation/host-api" }
operit-link = { path = "../../foundation/link" }
operit-access-runtime = { path = "../../access/runtime" }
operit-runtime = { path = "../../runtime/application", default-features = false, features = ["javascript"] }
operit-store = { path = "../../persistence/store" }
operit-tools = { path = "../../tool/services", default-features = false }
operit-util = { path = "../../foundation/util" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "rt-multi-thread", "time"] }
mdns-sd = "0.12"

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
operit-access-runtime = { path = "../../access/runtime", features = ["test-support"] }
operit-model = { path = "../../foundation/model" }
operit-rslink-runtime = { path = "../../rslink/runtime" }
rusqlite.workspace = true
