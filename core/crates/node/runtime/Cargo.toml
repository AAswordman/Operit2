[package]
name = "operit-node-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["full"]
# Shared routing/permission metadata, without the application execution runtime.
route-catalog = []
# Shared pairing/session engine; no ChatServiceCore, Provider or ToolPkg.
# Networking/execution belongs to Host providers; do not enable native Tokio I/O here.
peer-runtime = ["route-catalog", "peer-state", "dep:ring", "dep:uuid", "dep:futures-util", "dep:base64", "dep:serde_json", "dep:spake2", "dep:url", "dep:rand_core", "tokio/time"]
peer-state = ["dep:ring", "dep:operit-store", "dep:operit-util", "dep:serde_json", "dep:base64"]
full = ["operit-util/full", "route-catalog", "peer-runtime", "dep:operit-runtime", "dep:operit-store", "operit-store/full", "dep:operit-tools", "dep:operit-util", "dep:operit-rslink-runtime", "tokio/time"]
test-support = []

[dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js", "less-safe-getrandom-espidf"], optional = true }
# SPAKE2 turns the six-digit pairing code into a password-authenticated
# exchange: an active man in the middle can no longer verify a guessed code
# offline. getrandom stays off because the Host owns entropy on ESP32/WASM.
spake2 = { version = "0.4", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
uuid = { workspace = true, optional = true }

operit-peer-link = { path = "../peer-link" }
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
operit-host-api = { path = "../../foundation/host-api" }
operit-link = { path = "../../foundation/link" }
operit-rslink-runtime = { path = "../../rslink/runtime", optional = true }
operit-runtime = { path = "../../runtime/application", default-features = false, features = ["javascript"], optional = true }
operit-store = { path = "../../persistence/store", default-features = false, features = ["node-state"], optional = true }
operit-tools = { path = "../../tool/services", default-features = false, optional = true }
operit-util = { path = "../../foundation/util", default-features = false, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "sync", "rt"] }

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
operit-model = { path = "../../foundation/model" }
operit-rslink-runtime = { path = "../../rslink/runtime" }
rusqlite.workspace = true

operit-host-native-common = { path = "../../../../hosts/common/operit-host-native-common", features = ["tcp", "http", "scheduler"] }

[dependencies.url]
version = "2.5"
optional = true
