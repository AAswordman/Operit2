[package]
name = "operit-node-edge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Lightweight Edge Core node boundary for device apps."

[dependencies]
operit-node-runtime = { path = "../runtime", default-features = false, features = ["peer-runtime"] }
async-trait.workspace = true
operit-host-api = { path = "../../foundation/host-api" }
operit-edge-contract = { path = "../edge-contract" }
operit-link = { path = "../../foundation/link" }
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# Exercise the real full Core router against Edge without enlarging firmware dependencies.
operit-node-runtime = { path = "../runtime", default-features = false, features = ["full"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

operit-store = { path = "../../persistence/store", default-features = false, features = ["node-state"] }
operit-host-native-common = { path = "../../../../hosts/common/operit-host-native-common", default-features = false, features = ["tcp", "scheduler"] }
