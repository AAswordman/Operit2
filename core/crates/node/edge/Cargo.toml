[package]
name = "operit-node-edge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Lightweight Edge Core node boundary for device apps."

[dependencies]
async-trait.workspace = true
operit-host-api = { path = "../../foundation/host-api" }
operit-edge-contract = { path = "../edge-contract" }
operit-link = { path = "../../foundation/link" }
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
