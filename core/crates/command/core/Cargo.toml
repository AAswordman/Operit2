[package]
name = "operit-command-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
operit-vfs = { version = "0.1.0", path = "../../foundation/vfs" }
operit-runtime = { path = "../../runtime/application" }
operit-providers = { path = "../../provider/services" }
operit-store = { path = "../../persistence/store" }
operit-host-api = { path = "../../foundation/host-api" }
operit-local-models = { path = "../../provider/local-model" }
operit-model = { path = "../../foundation/model" }
operit-tools = { path = "../../tool/services" }
operit-util = { path = "../../foundation/util" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
operit-host-native-filesystem = { path = "../../../../hosts/common/operit-host-native-filesystem" }
operit-host-native-scheduler = { path = "../../../../hosts/common/operit-host-native-scheduler" }
operit-host-native-storage = { path = "../../../../hosts/common/operit-host-native-storage" }
