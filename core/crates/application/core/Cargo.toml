[package]
name = "operit-core-application"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
operit-host-api = { path = "../../foundation/host-api" }
operit-link = { path = "../../foundation/link" }
operit-node-runtime = { path = "../../node/runtime" }
operit-proxy-local = { path = "../../proxy/local" }
operit-plugin-sdk-ipc = { path = "../../plugin/sdk-ipc" }
operit-plugin-sdk-ipc-bridge = { path = "../../plugin/sdk-ipc-bridge" }
operit-runtime = { path = "../../runtime/application", default-features = false, features = ["javascript"] }
operit-tools = { path = "../../tool/services" }
operit-plugin-sdk = { path = "../../plugin/sdk" }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
serde_json.workspace = true

[dev-dependencies]
async-trait.workspace = true
operit-host-native-common = { path = "../../../../hosts/common/operit-host-native-common", default-features = false, features = ["fs", "http", "scheduler", "storage", "tcp"] }
operit-util = { path = "../../foundation/util" }

operit-node-edge = { path = "../../node/edge" }
operit-model = { path = "../../foundation/model" }
uuid.workspace = true
operit-store = { path = "../../persistence/store" }
zip.workspace = true
