[package]
name = "operit-js-bridge"
version = "2.0.0-preview.5"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.8"
base64.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10"
operit-host-api = { path = "../operit-host-api" }
operit-plugin-sdk = { path = "../operit-plugin-sdk" }
operit-store = { path = "../operit-store" }
operit-util = { path = "../operit-util" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
operit-host-native-scheduler = { path = "../../../hosts/common/operit-host-native-scheduler" }
zip.workspace = true
