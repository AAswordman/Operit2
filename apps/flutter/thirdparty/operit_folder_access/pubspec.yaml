name: operit_folder_access
description: Unified folder selection with Android SAF mounts and macOS security-scoped access.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  file_selector_platform_interface: ^2.7.0

dependency_overrides:
  file_selector_platform_interface:
    path: ../file_selector_platform_interface

flutter:
  plugin:
    platforms:
      android:
        package: app.operit.folder_access
        pluginClass: OperitFolderAccessPlugin
        dartPluginClass: OperitFolderAccessAndroid
      macos:
        pluginClass: OperitFolderAccessPlugin
        dartPluginClass: OperitFolderAccessMacOS
