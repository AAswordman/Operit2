name: operit_folder_access
description: Unified folder selection API with macOS security-scoped access.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: OperitFolderAccessPlugin
        dartPluginClass: OperitFolderAccessMacOS
