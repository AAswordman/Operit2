[package]
name = "operit-flutter-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
operit-data-rescue = { path = "../../../../core/crates/persistence/rescue" }
operit-core-application = { path = "../../../../core/crates/application/core" }
operit-proxy-local = { path = "../../../../core/crates/proxy/local" }
operit-host-api = { path = "../../../../core/crates/foundation/host-api" }
operit-link = { path = "../../../../core/crates/foundation/link" }
operit-runtime = { path = "../../../../core/crates/runtime/application", default-features = false, features = ["javascript"] }
operit-store = { path = "../../../../core/crates/persistence/store" }
operit-tools = { path = "../../../../core/crates/tool/services", default-features = false }
operit-util = { path = "../../../../core/crates/foundation/util" }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
operit-host-data-rescue = { path = "../../../../hosts/common/operit-host-data-rescue" }
operit-host-native-common = { path = "../../../../hosts/common/operit-host-native-common" }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
operit-node-runtime = { path = "../../../../core/crates/node/runtime" }
operit-host-native-storage = { path = "../../../../hosts/common/operit-host-native-storage" }
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
mdns-sd = "0.12"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
operit-host-android-native = { path = "../../../../hosts/android" }

[target.'cfg(windows)'.dependencies]
operit-host-windows-native = { path = "../../../../hosts/windows" }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
operit-host-linux-native = { path = "../../../../hosts/linux" }

[target.'cfg(target_env = "ohos")'.dependencies]
operit-host-ohos-native = { path = "../../../../hosts/ohos" }

[target.'cfg(target_os = "ios")'.dependencies]
operit-host-ios-native = { path = "../../../../hosts/ios" }

[target.'cfg(target_os = "macos")'.dependencies]
operit-host-macos-native = { path = "../../../../hosts/macos" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
operit-host-web = { path = "../../../../hosts/web" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tokio = { version = "1", default-features = false, features = ["macros", "sync"] }

[profile.dev.package.operit-plugin-theme]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.crc32fast]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.zip]
opt-level = 2

[profile.dev.package.roxmltree]
opt-level = 2
