[package]
name = "operit-markdown-pipeline-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "../markdown_pipeline_fixture.rs"
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
operit-host-api = { path = "../../../../../../core/crates/foundation/host-api" }
operit-host-native-common = { path = "../../../../../../hosts/common/operit-host-native-common" }
operit-link = { path = "../../../../../../core/crates/foundation/link" }
operit-util = { path = "../../../../../../core/crates/foundation/util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
