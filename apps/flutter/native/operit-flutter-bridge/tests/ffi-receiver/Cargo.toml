[package]
name = "operit-ffi-receiver-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "../ffi_receiver_fixture.rs"
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
operit-host-api = { path = "../../../../../../core/crates/foundation/host-api" }
operit-host-native-common = { path = "../../../../../../hosts/common/operit-host-native-common" }
operit-host-native-filesystem = { path = "../../../../../../hosts/common/operit-host-native-filesystem" }
operit-link = { path = "../../../../../../core/crates/foundation/link" }
operit-util = { path = "../../../../../../core/crates/foundation/util", default-features = false }
operit-vfs = { path = "../../../../../../core/crates/foundation/vfs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
