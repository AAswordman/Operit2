[package]
name = "operit-headless-sensor"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
operit-edge-sdk = { path = "../../sdk", features = ["space"] }
operit-host-native-common = { path = "../../../hosts/common/operit-host-native-common", features = ["tcp", "storage"] }
operit-host-native-scheduler = { path = "../../../hosts/common/operit-host-native-scheduler", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "io-util"] }
serde_json = "1"
