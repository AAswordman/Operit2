[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --chip esp32"
# Resolve available symbols from the matching ELF on the host. Embedded Rust
# caller file/line records are omitted to fit the fixed Flash partition.
rustflags = ["--cfg", "espidf_time64", "--cfg", "mio_unsupported_force_poll_poll", "-Z", "location-detail=none", "-Z", "unstable-options", "-C", "panic=immediate-abort"]

[unstable]
build-std = ["std", "panic_abort"]
# Abort panics immediately. Structured errors and native crash diagnostics
# remain available; resolve native backtraces with the matching ELF on the host.
build-std-features = ["backtrace", "panic-unwind", "backtrace-trace-only", "optimize_for_size"]

[env]
CARGO_WORKSPACE_DIR = { value = ".", relative = true, force = true }
MCU = "esp32"
ESP_IDF_VERSION = "v5.3.2"
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "sdkconfig.defaults", relative = true }
ESP_IDF_COMPONENTS = "main;app_update;bootloader;driver;fatfs;spiffs;wear_levelling;nvs_flash;esp_event;esp_netif;esp_wifi;esp_http_server;esp_http_client;espressif__mdns;ui_port;operit_board_audio"
ESP_IDF_GLOB_PARTITIONS_BASE = { value = ".", relative = true, force = true }
ESP_IDF_GLOB_PARTITIONS_0 = "partitions.csv"

CFLAGS_xtensa_esp32_espidf = "-mlongcalls"
