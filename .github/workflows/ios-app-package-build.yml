name: iOS App Package Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM64 rootfs build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl python3 qemu-user-static binfmt-support

      - name: Build Alpine ARM64 rootfs
        run: sudo bash tools/ios-runtime/arm64/build_rootfs_linux.sh

      - name: Upload Alpine ARM64 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: operit2-ios-arm64-rootfs-${{ github.sha }}
          path: |
            apps/flutter/app/ios/Runner/arm64-rootfs.tar.gz
            apps/flutter/app/ios/Runner/arm64-rootfs.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  package-ios:
    needs: build-arm64-rootfs
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Alpine ARM64 rootfs
        uses: actions/download-artifact@v4
        with:
          name: operit2-ios-arm64-rootfs-${{ github.sha }}
          path: apps/flutter/app/ios/Runner

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache project Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/fvm
          key: ${{ runner.os }}-fvm-${{ hashFiles('apps/flutter/app/.fvmrc') }}

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/flutter/app/pubspec.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install iOS runtime and V8 build tools
        run: |
          brew install llvm@23 lld@23 cmake ninja
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@23)/bin" >> "$GITHUB_PATH"

      - name: Identify iOS build toolchain
        id: ios-build-toolchain
        run: |
          toolchain_hash="$({
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos clang --version
            "$(brew --prefix llvm@23)/bin/clang" --version
            "$(brew --prefix lld@23)/bin/ld64.lld" --version
            cmake --version
            ninja --version
          } | shasum -a 256 | awk '{ print $1 }')"
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Cache source-built iOS V8
        uses: actions/cache@v4
        with:
          path: tools/release/work/ios-v8/*/aarch64-apple-ios
          key: ${{ runner.os }}-${{ runner.arch }}-ios-v8-${{ steps.ios-build-toolchain.outputs.hash }}-${{ hashFiles('tools/build_scripts/prepare_ios_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Check build environment
        run: |
          python3 tools/build_scripts/check_build_environment.py --products app --github-runner
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version

      - name: Build iOS ARM64 runtime
        run: bash tools/ios-runtime/arm64/build.sh ios

      - name: Cache Cargo outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            core/target
            apps/flutter/native/operit-flutter-bridge/target
            hosts/apple/target
            hosts/web/target
            target/operit-build-tools
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN_VERSION }}-cargo-ios-${{ hashFiles('core/Cargo.lock', 'core/crates/**/Cargo.toml', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock', 'apps/flutter/native/operit-flutter-bridge/Cargo.toml', 'hosts/apple/Cargo.lock', 'hosts/apple/Cargo.toml', 'hosts/web/Cargo.lock', 'hosts/web/Cargo.toml') }}

      - name: Prepare matching jitless V8 library and bindings
        run: |
          rustup target add aarch64-apple-ios
          python3 tools/build_scripts/prepare_ios_v8.py --target aarch64-apple-ios --env-file tools/release/work/ios-v8/device.env

      - name: Build and package unsigned iOS app
        run: python3 tools/build_scripts/build_flutter_ios.py

      - name: Upload unsigned iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit2-ios-${{ github.sha }}
          path: tools/release/dist/operit2-app-ios-arm64-*.zip
          if-no-files-found: error
          retention-days: 14
