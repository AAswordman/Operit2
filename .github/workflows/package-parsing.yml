name: Package parsing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-parsing:
    name: Package parsing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Awarnings
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Prepare plugin build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python -m venv .venv
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          corepack enable
      - name: Parse all bundled packages with the production loader
        run: .venv/bin/python plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload
