name: Terminal Plugin Checks

on:
  pull_request:
    paths:
      - '.github/workflows/terminal-plugin-checks.yml'
      - 'plugins/packages/buildin/super_admin/**'
      - 'tools/tests/super_admin_terminal_routing.test.mjs'
      - 'tools/tests/clean_on_exit_output.test.mjs'
      - 'tools/tests/fixtures/super_admin_runtime.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/terminal-plugin-checks.yml'
      - 'plugins/packages/buildin/super_admin/**'
      - 'tools/tests/super_admin_terminal_routing.test.mjs'
      - 'tools/tests/clean_on_exit_output.test.mjs'
      - 'tools/tests/fixtures/super_admin_runtime.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sessions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install checker
        run: npm install --prefix .ci-tools/typescript --no-save typescript@5.9.2
      - name: Check plugin types
        run: node .ci-tools/typescript/node_modules/typescript/bin/tsc --noEmit -p plugins/packages/buildin/super_admin/tsconfig.json
      - name: Check terminal lifetime and output
        run: node --test tools/tests/super_admin_terminal_routing.test.mjs tools/tests/clean_on_exit_output.test.mjs tools/tests/terminal_streaming.test.mjs
