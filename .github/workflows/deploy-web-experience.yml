name: Deploy Web Experience

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      WASM_BINDGEN_VERSION: 0.2.122

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Web build hook dependencies
        run: |
          python -m venv .venv
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3

      - name: Install built-in workflow plugin dependencies
        working-directory: plugins/packages/buildin/workflow
        run: corepack pnpm install --frozen-lockfile

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Build Flutter Web experience
        working-directory: apps/flutter/app
        run: fvm flutter build web --release --no-wasm-dry-run --base-href /

      - name: Verify Flutter Web output
        run: |
          test -s apps/flutter/app/build/web/index.html
          test -s apps/flutter/app/build/web/main.dart.js
          test -s apps/flutter/app/build/web/assets/assets/model_logos/DEEPSEEK.svg
          test -s apps/flutter/app/build/web/runtime/generated/operit_runtime_worker.js

      - name: Configure Web custom domain
        run: printf 'web.operit.app\n' > apps/flutter/app/build/web/CNAME

      - name: Publish to gh-pages branch
        run: |
          staging_dir="$RUNNER_TEMP/operit-gh-pages"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"
          cp -a apps/flutter/app/build/web/. "$staging_dir/"
          git checkout -B gh-pages "$GITHUB_SHA"
          git rm -rf .
          cp -a "$staging_dir/." .
          git add --all
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "deploy: $GITHUB_SHA"
          git push origin HEAD:gh-pages --force
