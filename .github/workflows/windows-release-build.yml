name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "all"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      cli_arches:
        description: "Windows CLI architectures"
        required: false
        default: "all"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      # Pre-cache must run AFTER `fvm install` so .fvm/flutter_sdk is a valid
      # symlink/junction to the FVM-managed SDK. Running it earlier writes into
      # a plain directory that `fvm install` later replaces, losing the cache.
      - name: Pre-cache Windows engine artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = "apps/flutter/app/.fvm/flutter_sdk"
          if (-not (Test-Path (Join-Path $sdk "bin\flutter.bat"))) {
            throw "Flutter SDK not found at $sdk - is .fvm/flutter_sdk a valid FVM link?"
          }
          $version = "3.41.10-ohos-0.0.2-beta.operit.1"
          $base = "https://github.com/AAswordman/flutter-ohos/releases/download/$version"
          $cacheDir = Join-Path $sdk "bin/cache/artifacts/windows-sdk"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          $targets = @(
            @{ Dir = "windows-x64"; Zip = "windows-x64-debug.zip" },
            @{ Dir = "windows-x64-profile"; Zip = "windows-x64-profile.zip" },
            @{ Dir = "windows-x64-release"; Zip = "windows-x64-release.zip" }
          )

          foreach ($t in $targets) {
            $zipPath = Join-Path $env:TEMP $t.Zip
            Write-Output "Downloading $($t.Zip) ..."
            curl.exe -L --fail --retry 3 --retry-delay 5 -o $zipPath "$base/$($t.Zip)" --max-time 600
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download $($t.Zip) (curl exit code $LASTEXITCODE)"
            }
            $dest = Join-Path $cacheDir $t.Dir
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Write-Output "Extracting $($t.Zip) to $dest ..."
            Expand-Archive -Path $zipPath -DestinationPath $dest -Force
            Remove-Item $zipPath -Force
          }

          $stampFile = Join-Path $sdk "bin/cache/windows-sdk.stamp"
          Set-Content -Path $stampFile -Value $version -NoNewline -Encoding ascii
          Write-Output "Wrote stamp: $version"
          Get-ChildItem $cacheDir | Select-Object Name

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress --limit-output --yes

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products "${{ inputs.products }}" --cli-arches "${{ inputs.cli_arches }}" --github-runner

      - name: Build and package Windows app
        if: inputs.products != 'cli'
        shell: pwsh
        run: python tools/build_scripts/build_flutter_windows.py --archive-path tools/release/dist/operit2-app-windows-x86_64.zip --enforce-lockfile

      - name: Build and package Windows CLI
        if: inputs.products != 'app'
        shell: pwsh
        run: python tools/build_scripts/build_cli_windows.py --arches "${{ inputs.cli_arches }}"

      - name: Upload Windows app artifact
        if: inputs.products != 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-app-${{ github.sha }}
          path: tools/release/dist/operit2-app-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-windows-*.zip
          if-no-files-found: error
          retention-days: 14