name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "all"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      cli_arches:
        description: "Windows CLI architectures"
        required: false
        default: "all"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress --limit-output --yes

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products "${{ inputs.products }}" --cli-arches "${{ inputs.cli_arches }}" --github-runner

      - name: Pre-cache Windows engine artifacts
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:GITHUB_WORKSPACE "apps\flutter\app\.fvm\flutter_sdk"
          $cacheRoot = Join-Path $sdkRoot "bin\cache\artifacts\windows-sdk"
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          $base = "https://github.com/AAswordman/flutter-ohos/releases/download/3.41.10-ohos-0.0.2-beta.operit.1"
          foreach ($mode in @("debug", "profile", "release")) {
            $dir = Join-Path $cacheRoot "windows-x64-$mode"
            if (Test-Path (Join-Path $dir "flutter_windows.dll")) { continue }
            $zip = Join-Path $cacheRoot "windows-x64-$mode.zip"
            Write-Host "Downloading windows-x64-$mode.zip ..."
            Invoke-WebRequest -Uri "$base/windows-x64-$mode.zip" -OutFile $zip -UseBasicParsing
            Write-Host "Extracting windows-x64-$mode.zip ..."
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            Remove-Item $zip -Force
          }
          # Mark the artifact as up-to-date so flutter assemble does not try
          # to re-download these archives with Dart's HttpClient (which fails
          # on this runner).  The stamp content must equal the fork engine version.
          $stampDir = Join-Path $sdkRoot "bin\cache"
          $stampFile = Join-Path $stampDir "windows-sdk.stamp"
          Set-Content -Path $stampFile -Value "3.41.10-ohos-0.0.2-beta.operit.1" -NoNewline -Encoding ascii
          Write-Host "Wrote stamp: $stampFile"

      - name: Build and package Windows app
        if: inputs.products != 'cli'
        shell: pwsh
        run: python tools/build_scripts/build_flutter_windows.py --archive-path tools/release/dist/operit2-app-windows-x86_64.zip --enforce-lockfile

      - name: Build and package Windows CLI
        if: inputs.products != 'app'
        shell: pwsh
        run: python tools/build_scripts/build_cli_windows.py --arches "${{ inputs.cli_arches }}"

      - name: Upload Windows app artifact
        if: inputs.products != 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-app-${{ github.sha }}
          path: tools/release/dist/operit2-app-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-windows-*.zip
          if-no-files-found: error
          retention-days: 14
