name: iOS Scientific Runtime Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scientific-runtime:
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS scientific runtime
        run: python3 tools/ios-runtime/native/build_scientific.py

      - name: Upload scientific runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-ios-scientific-runtime-${{ github.sha }}
          path: tools/ios-runtime/native/output/OperitPythonScientific.xcframework
          if-no-files-found: error
          retention-days: 14
