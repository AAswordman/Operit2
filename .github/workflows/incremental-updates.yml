name: Incremental Update Merge

on:
  pull_request:
    paths:
      - '.github/workflows/incremental-updates.yml'
      - 'core/Cargo.toml'
      - 'core/Cargo.lock'
      - 'core/crates/foundation/util/**'
      - 'core/crates/foundation/host-api/**'
      - 'core/crates/foundation/host-contract/**'
      - 'core/crates/foundation/vfs/**'
      - 'hosts/common/operit-host-native-storage/**'
      - 'hosts/common/operit-host-native-filesystem/**'
      - 'hosts/android/src/update_*.rs'
      - 'hosts/android/src/system_operation.rs'
      - 'hosts/windows/src/process.rs'
      - 'hosts/windows/src/tools/system/mod.rs'
      - 'hosts/windows/src/tools/system/update_msi.rs'
      - 'apps/flutter/native/operit-flutter-bridge/src/FlutterSystemOperationBridge.rs'
      - 'core/crates/runtime/application/src/core/application/ApplicationUpdate.rs'
      - 'apps/cli/src/cli/mod.rs'
      - 'apps/cli/src/tui/core/app.rs'
      - 'apps/cli/src/tui/view/render.rs'
      - 'apps/flutter/app/.fvmrc'
      - 'apps/flutter/app/pubspec.yaml'
      - 'apps/flutter/app/pubspec.lock'
      - 'apps/flutter/app/lib/core/update/**'
      - 'apps/flutter/app/lib/ui/features/update/**'
      - 'apps/flutter/app/test/update/**'
      - 'tools/tests/fixtures/msi_cabinet_delta.json'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/incremental-updates.yml'
      - 'core/Cargo.toml'
      - 'core/Cargo.lock'
      - 'core/crates/foundation/util/**'
      - 'core/crates/foundation/host-api/**'
      - 'core/crates/foundation/host-contract/**'
      - 'core/crates/foundation/vfs/**'
      - 'hosts/common/operit-host-native-storage/**'
      - 'hosts/common/operit-host-native-filesystem/**'
      - 'hosts/android/src/update_*.rs'
      - 'hosts/android/src/system_operation.rs'
      - 'hosts/windows/src/process.rs'
      - 'hosts/windows/src/tools/system/mod.rs'
      - 'hosts/windows/src/tools/system/update_msi.rs'
      - 'apps/flutter/native/operit-flutter-bridge/src/FlutterSystemOperationBridge.rs'
      - 'core/crates/runtime/application/src/core/application/ApplicationUpdate.rs'
      - 'apps/cli/src/cli/mod.rs'
      - 'apps/cli/src/tui/core/app.rs'
      - 'apps/cli/src/tui/view/render.rs'
      - 'apps/flutter/app/.fvmrc'
      - 'apps/flutter/app/pubspec.yaml'
      - 'apps/flutter/app/pubspec.lock'
      - 'apps/flutter/app/lib/core/update/**'
      - 'apps/flutter/app/lib/ui/features/update/**'
      - 'apps/flutter/app/test/update/**'
      - 'tools/tests/fixtures/msi_cabinet_delta.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Verify portable deltas, bounded I/O, cancellation and native container codecs
        run: cargo test --locked --manifest-path core/Cargo.toml -p operit-util --test incremental_updates
  progress-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FVM_VERSION: 4.3.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare plugin build dependencies
        run: |
          python -m venv .venv
          corepack enable pnpm
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emscripten lld
      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get
      - name: Verify update progress and user actions
        working-directory: apps/flutter/app
        run: fvm flutter test test/update/core_app_update_backend_test.dart test/update/app_update_test.dart test/update/app_update_base_prompt_test.dart
