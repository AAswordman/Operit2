name: Incremental Update Merge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Verify portable deltas, bounded I/O, cancellation and native container codecs
        run: cargo test --locked --manifest-path core/Cargo.toml -p operit-util --test incremental_updates
  progress-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FVM_VERSION: 4.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare plugin build dependencies
        run: |
          python -m venv .venv
          corepack enable pnpm
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emscripten lld
      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get
      - name: Generate runtime assets and Dart proxies
        run: |
          python plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload
          python tools/build_scripts/models_dev_bundle.py
          cargo check --locked --manifest-path core/crates/proxy/local/Cargo.toml --quiet
          test -s apps/flutter/app/lib/core/proxy/generated/CoreProxyClients.g.dart
          test -s apps/flutter/app/lib/core/proxy/generated/CoreProxyModels.g.dart
      - name: Verify update progress and user actions
        working-directory: apps/flutter/app
        run: fvm flutter test test/update/core_app_update_backend_test.dart test/update/app_update_test.dart test/update/app_update_base_prompt_test.dart
